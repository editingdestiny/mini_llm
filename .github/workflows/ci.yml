name: CI: Build & Push to GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: editingdestiny/mini-llm
  COMMIT_SHA: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Pull image for verification
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_SHA }}"
          docker pull "$IMAGE_TAG"
          echo "sha_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run smoke test
        run: |
          echo "Checking image was pushed..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_SHA }}"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_SHA }} --quiet
          echo "✓ Image pulled successfully"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME,COMMIT_SHA
          env:
            REGISTRY: ghcr.io
            IMAGE_NAME: editingdestiny/mini-llm
            COMMIT_SHA: ${{ github.sha }}
          script: |
            set -e
            export IMAGE_TAG="$REGISTRY/$IMAGE_NAME:$COMMIT_SHA"
            export LATEST_TAG="$REGISTRY/$IMAGE_NAME:latest"
            MINI_LLM_DIR="/home/sd22750/mini-llm"

            echo "🔄 Syncing docker-compose.yml from repo..."
            # docker-compose.yml is already at the right path via host volume or git pull
            cd "$MINI_LLM_DIR"
            git pull origin main

            echo "🏷️  Tagging image as latest..."
            docker image tag "$IMAGE_TAG" "$LATEST_TAG"
            docker push "$LATEST_TAG"

            echo "🛑 Stopping old container..."
            cd "$MINI_LLM_DIR"
            docker-compose down || true

            echo "🚀 Starting new container with SHA image..."
            IMAGE="$IMAGE_TAG" docker-compose up -d

            echo "⏳ Waiting for startup..."
            sleep 15

            echo "🧪 Smoke test..."
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 https://mini-llm.sd-ai.co.uk 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Smoke test passed (HTTP $HTTP_CODE)"
            else
              echo "❌ Smoke test failed (HTTP $HTTP_CODE)"
              docker-compose logs --tail 30
              exit 1
            fi

            echo "✅ Deploy complete!"
