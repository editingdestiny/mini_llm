name: CI Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: editingdestiny/mini-llm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify image
        run: |
          echo "Image pushed successfully"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mini-llm.sd-ai.co.uk

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME,GITHUB_SHA
          env:
            REGISTRY: ghcr.io
            IMAGE_NAME: editingdestiny/mini-llm
            GITHUB_SHA: ${{ github.sha }}
          script: |
            set -e
            IMAGE_TAG="$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"
            LATEST_TAG="$REGISTRY/$IMAGE_NAME:latest"
            MINI_LLM_DIR="/home/sd22750/mini-llm"

            echo "Pulling latest code..."
            cd "$MINI_LLM_DIR"
            git pull origin main

            echo "Pulling new image..."
            docker pull "$IMAGE_TAG"

            echo "Tagging as latest..."
            docker image tag "$IMAGE_TAG" "$LATEST_TAG"
            docker push "$LATEST_TAG"

            echo "Restarting container..."
            docker-compose down || true
            docker-compose up -d

            echo "Waiting for startup..."
            sleep 15

            echo "Smoke test..."
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 https://mini-llm.sd-ai.co.uk 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "PASS: HTTP $HTTP_CODE"
            else
              echo "FAIL: HTTP $HTTP_CODE"
              docker-compose logs --tail 20
              exit 1
            fi
            echo "Deploy complete."
