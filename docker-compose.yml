services:
  mini-llm:
    image: mini-llm:fixed4
    container_name: mini-llm
    networks:
      - traefik_network
    volumes:
      - /home/sd22750/mini-llm:/app
    ports:
      - "8503:8502"
    command: streamlit run /app/streamlit_app.py --server.port 8502 --server.address 0.0.0.0
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mini-llm.rule=Host(`mini-llm.sd-ai.co.uk`)"
      - "traefik.http.routers.mini-llm.entrypoints=websecure"
      - "traefik.http.routers.mini-llm.tls.certresolver=letsencrypt"
      - "traefik.http.services.mini-llm.loadbalancer.server.port=8502"

networks:
  traefik_network:
    external: true
